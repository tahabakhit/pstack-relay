name: CI
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Go checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./cmd/upstream sync --check
      - run: go run ./cmd/build-plugin --check
      - run: sh -n overlay/bin/pstack-relay
      - name: Check POSIX shell runtime
        if: runner.os == 'Linux'
        run: shellcheck -s sh overlay/bin/pstack-relay
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
